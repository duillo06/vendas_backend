name: Deploy Production

# Push em main → SSH na VPS Hostinger → remote-deploy.sh
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          # VPS Hostinger às vezes é lenta no build — 15 min
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/foodservice/vendas_backend
            # confs geradas na VPS travam o git pull — descarta antes
            git checkout -- deploy/nginx/default.conf deploy/caddy/Caddyfile 2>/dev/null || true
            export DEPLOY_BRANCH=main
            bash deploy/scripts/remote-deploy.sh
